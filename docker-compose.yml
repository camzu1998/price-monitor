
services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            args:
                USER_ID: 1000
                GROUP_ID: 1000
                USER_NAME: camzu
        container_name: price_monitor_app
        restart: unless-stopped
        volumes:
            - ./:/var/www/html
            - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
        networks:
            - price_monitor_network
        depends_on:
            - postgres
            - redis

    nginx:
        image: nginx:alpine
        container_name: price_monitor_nginx
        restart: unless-stopped
        ports:
            - "8080:80"
        volumes:
            - ./:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        networks:
            - price_monitor_network
        depends_on:
            - app

    postgres:
        image: postgres:15
        container_name: price_monitor_postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: price_monitor
            POSTGRES_USER: dev_user
            POSTGRES_PASSWORD: dev_password
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
        networks:
            - price_monitor_network

    redis:
        image: redis:alpine
        container_name: price_monitor_redis
        restart: unless-stopped
        ports:
            - "6379:6379"
        networks:
            - price_monitor_network

networks:
    price_monitor_network:
        driver: bridge

volumes:
    postgres_data:
